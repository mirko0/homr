name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      # torch and its CUDA wheels no longer fit on a stock runner: poetry
      # install died with "[Errno 28] No space left on device" from 2026-09.
      # Drop toolchains this project never uses (~20 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            poetry.lock

      - name: Install poetry
        run: |
          python -m pip install poetry

      - name: Init
        run: make init-poetry

      - name: CI
        run: make ci

      - name: Downloads models CPU
        run: poetry run homr --init --gpu no

      - name: Downloads models GPU
        run: poetry run homr --init --gpu force
